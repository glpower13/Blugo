name: Deploy PWA to GitHub Pages

# Deploys the built PWA to GitHub Pages once changes land on the default
# branch. Runs the quality gate (lint + tests) before building, so a broken
# build never reaches the live app. Manual runs possible via "Run workflow".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: read the repo, write Pages, mint the OIDC token Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once; let a newer one supersede an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          # Serve under /<repo>/ on project Pages; rename-safe.
          BASE_PATH: "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
