name: CI

# Full quality gate on every push/PR: typecheck, lint, unit tests, and the
# Playwright E2E (Stufe B of docs/TEST-UND-PRUEF-STANDARD.md). Kept separate
# from the Pages deploy so quality runs on all branches, deploy only on main.
on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
