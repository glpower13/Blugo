<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="NEUROLANG">
  <!--
    NEUROLANG — App-Zeichen.

    IDEE: Das schwedische Kreuz als AUSSPARUNG in einer Goldplatte. Kein
    Buchstabe, kein Maskottchen, keine Sprechblase — die drei Dinge, die in
    dieser Kategorie fast alle machen. Ein Negativraum-Zeichen ist dort selten
    und trägt zwei Aussagen gleichzeitig:

      · Schweden — echte Flaggen-Geometrie (Querbalken mittig, Längsbalken zur
        Stange versetzt), also erkennbar und nicht bloß dekorativ.
      · Die eine Design-Regel — im Schnittpunkt sitzt EIN Lichtpunkt: das eine
        wahre Signal, um das die ganze App gebaut ist.

    Die Aussparung zeigt die Tiefe darunter — das Kreuz ist kein aufgemaltes
    Symbol, sondern ein Durchblick. Champagner-Gold auf tiefem Petrol, dieselbe
    Palette wie die App (docs/design-handschrift.md).

    Alles Wesentliche liegt in der mittleren 62 %, damit das Zeichen jeden
    maskable-Zuschnitt (Kreis, Squircle) unbeschadet übersteht.
  -->
  <defs>
    <!-- Tiefe hinter der Platte: das, was durch das Kreuz sichtbar wird. -->
    <radialGradient id="depth" cx="50%" cy="38%" r="72%">
      <stop offset="0%" stop-color="#123039" />
      <stop offset="55%" stop-color="#0A1A22" />
      <stop offset="100%" stop-color="#05080E" />
    </radialGradient>
    <!-- Gebürstetes Gold: Lichtkante oben links, Schatten unten rechts. -->
    <linearGradient id="gold" x1="14%" y1="4%" x2="86%" y2="98%">
      <stop offset="0%" stop-color="#FBE7C2" />
      <stop offset="30%" stop-color="#E7C08A" />
      <stop offset="62%" stop-color="#C79A5F" />
      <stop offset="100%" stop-color="#8F6B3C" />
    </linearGradient>
    <!-- Der Lichtpunkt im Schnittpunkt. -->
    <radialGradient id="spark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF6E2" stop-opacity="1" />
      <stop offset="40%" stop-color="#FFE0A8" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#E7C08A" stop-opacity="0" />
    </radialGradient>
    <!-- Weicher Glanz über der oberen Kante (Glas/Metall-Anmutung). -->
    <linearGradient id="sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.20" />
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!--
      Die Goldplatte MIT ausgespartem Kreuz. Flaggen-Geometrie aufs Quadrat
      übertragen: Balkenbreite rund 1/6 der Platte, Längsbalken nach links
      versetzt — dieselbe Asymmetrie wie in der schwedischen Flagge.
    -->
    <mask id="cut">
      <rect x="96" y="96" width="320" height="320" rx="86" fill="#fff" />
      <rect x="96" y="224" width="320" height="64" fill="#000" />
      <rect x="186" y="96" width="64" height="320" fill="#000" />
    </mask>
  </defs>

  <rect width="512" height="512" rx="112" fill="#05080E" />
  <rect x="96" y="96" width="320" height="320" rx="86" fill="url(#depth)" />
  <rect x="96" y="96" width="320" height="320" rx="86" fill="url(#gold)" mask="url(#cut)" />
  <rect x="96" y="96" width="320" height="200" rx="86" fill="url(#sheen)" mask="url(#cut)" />

  <!-- Der eine Lichtpunkt: im Schnittpunkt der Balken -->
  <circle cx="218" cy="256" r="58" fill="url(#spark)" />
  <circle cx="218" cy="256" r="12" fill="#FFF6E2" />

  <!-- Feine Goldkante: der Schmuckstück-Rand -->
  <rect
    x="97.5"
    y="97.5"
    width="317"
    height="317"
    rx="85"
    fill="none"
    stroke="#E7C08A"
    stroke-opacity="0.42"
    stroke-width="3"
  />
</svg>
